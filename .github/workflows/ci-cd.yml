name: CI/CD

on:
  pull_request:
    branches: [main, preprod]
  push:
    branches: [main, preprod]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: edusen_plateforme

jobs:
  validate:
    name: Lint and build
    runs-on: ubuntu-latest
    environment: ${{ github.base_ref == 'main' && 'production' || github.ref_name == 'main' && 'production' || 'preproduction' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL }}

  docker:
    name: Build and publish Docker image
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'preproduction' }}
    env:
      TARGET_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'preproduction' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify frontend API configuration
        shell: bash
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL }}
        run: |
          echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-<missing>}"
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "::error::NEXT_PUBLIC_API_URL is missing in Settings > Environments > ${TARGET_ENVIRONMENT} > Variables."
            exit 1
          fi
          echo "Checking backend readiness..."
          if curl --fail-with-body --silent --show-error \
            --retry 6 --retry-delay 10 --retry-all-errors \
            "$NEXT_PUBLIC_API_URL/health/ready"; then
            echo
            echo "Backend is ready."
          else
            echo
            echo "::warning::Backend is temporarily unavailable after retries. The frontend image will still be built and published."
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=preprod,enable=${{ github.ref == 'refs/heads/preprod' }}
            type=sha,prefix={{branch}}-

      - name: Build image for pull request
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Coolify deployment
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'preproduction' }}
    steps:
      - name: Trigger deployment
        shell: bash
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "The Coolify webhook for this branch is not configured."
            exit 1
          fi

          headers=(-H "Content-Type: application/json")
          if [ -n "$COOLIFY_TOKEN" ]; then
            headers+=(-H "Authorization: Bearer $COOLIFY_TOKEN")
          fi

          curl --fail-with-body --silent --show-error \
            --request GET "$COOLIFY_WEBHOOK" \
            "${headers[@]}"
